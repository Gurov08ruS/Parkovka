<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="style.css">
	<title>Чужое место — фиксация нарушений парковки на местах для инвалидов</title>
</head>
<body>
	<main>
		<header>
			<h1 class="head_text">ЧУЖОЕ МЕСТО</h1>
			<p class="head_subtext">Сервис доступной среды</p>
		</header>
		<div class="first_block">
			<h2>Не занимай чужое место</h2>
			<p>Помогите сохранить парковочные места для людей с инвалидностью.</p>
			<p>Город должен быть доступен каждому.</p>
		</div>

		<div class="second_block">
			<button class="fix_button">Сообщить о нарушении</button>
			<p class="hint_text">Отправить фотографию и адрес</p>
		</div>

		<div class="container_block">
			<div class="card">
				<img src="images/icons/clipboard.png" alt="" class="card_icon">
				<h2>Мои обращения</h2>
				<p>История сообщений</p>
			</div>
			<div class="card">
				<img src="images/icons/info-circle.png" alt="" class="card_icon">
				<h2>О проекте</h2>
				<p>Как работает сервис</p>
			</div>
		</div>
	</main>
</body>
</html>
