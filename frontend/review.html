<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="light dark">
	<meta name="theme-color" content="#BFE8FC" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#0B111C" media="(prefers-color-scheme: dark)">
	<script src="theme.js"></script>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="style.css">
	<script src="review.js" type="module"></script>
	<title>Кабинет проверяющего — Чужое место</title>
</head>
<body>
	<main class="review-workspace">
		<header class="review-header">
			<h1>Кабинет проверяющего</h1>
			<a class="panel-button" id="site-link" href="/?tab=profile">На сайт</a>
		</header>
		<p class="review-storage-warning" id="review-storage-warning" role="status" hidden>На сервере заканчивается свободное место. Осталось меньше 2 ГиБ.</p>
		<section class="capture-section" id="review-account" aria-label="Аккаунт проверяющего" hidden></section>
		<section class="tab-screen" aria-labelledby="review-title">
			<h2 id="review-title" hidden></h2>
			<div class="panel-stack" id="review-content"><p role="status">Загрузка…</p></div>
		</section>
		<footer class="site-version" id="site-version" hidden></footer>
	</main>
</body>
</html>
